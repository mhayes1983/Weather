name: Android release

on:
  push:
    tags: ['android-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet workload install maui-android
      - run: npm ci
        working-directory: weather.client
      - name: Restore signing key
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\weather.keystore", [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
      - name: Build signed APK
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >
          dotnet publish Weather.Android/Weather.Android.csproj -c Release -o publish
          -p:AndroidKeyStore=true
          "-p:AndroidSigningKeyStore=$env:RUNNER_TEMP\weather.keystore"
          -p:AndroidSigningKeyAlias=weather
          -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD
          -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD
      - name: Attach to a GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-Item publish/*-Signed.apk) --title "${{ github.ref_name }}" --generate-notes
